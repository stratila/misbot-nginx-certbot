# misbot-prod.minecraftislife.online — keep in sync with DOMAINS in domains.env.

server {
    listen 80;
    server_name misbot-prod.minecraftislife.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name misbot-prod.minecraftislife.online;

    ssl_certificate     /etc/letsencrypt/live/misbot-prod.minecraftislife.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/misbot-prod.minecraftislife.online/privkey.pem;

    resolver 127.0.0.1 valid=30s;

    # HSTS header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Shared proxy settings — inherited by every location below (which set no
    # proxy_set_header of their own, so inheritance is not cancelled).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Reverse proxy all requests to the bot
    location /webhook {
        proxy_pass http://host.containers.internal:8181/webhook;
    }

    location ^~ /player/ {
        proxy_pass http://host.containers.internal:8181;
    }
}
