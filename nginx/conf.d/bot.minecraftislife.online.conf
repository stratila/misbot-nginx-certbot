# bot.minecraftislife.online — keep in sync with DOMAINS in domains.env.
# Static-only site (no upstream): serves files bind-mounted into the nginx
# container at /usr/share/nginx/static/bot.minecraftislife.online (host source
# in the nginx quadlet's Volume=).

server {
    listen 80;
    server_name bot.minecraftislife.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bot.minecraftislife.online;

    ssl_certificate     /etc/letsencrypt/live/bot.minecraftislife.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.minecraftislife.online/privkey.pem;

    # HSTS header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /imageframecontent/ {
        alias /usr/share/nginx/static/bot.minecraftislife.online/;
        expires 7d;
        # This location sets its own add_header, so the server-level HSTS above
        # is NOT inherited here — repeat it alongside Cache-Control.
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ =404;
    }
}
