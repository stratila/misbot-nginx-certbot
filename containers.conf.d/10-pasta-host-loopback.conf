# Drop-in for ~/.config/containers/containers.conf.d/ — merged over
# containers.conf, so this file can be replaced on every deploy without
# clobbering unrelated settings the host may have.
#
# The pod has no Network= (see quadlets/misbot-nginx-certbot.pod), so it uses
# the rootless default, pasta. By default pasta cannot reach services bound to
# the host's 127.0.0.1, which is where the bot listens (:8181).
# --map-host-loopback exposes the host loopback inside the container at
# 169.254.1.2 — the same address host.containers.internal resolves to, so
# proxy_pass http://host.containers.internal:8181 works unchanged.
#
# Read at container *creation*, not start: the pod must be recreated (the
# deploy stops it, and ExecStartPre passes --replace) to pick up changes here.
[network]
pasta_options = ["--map-host-loopback", "169.254.1.2"]
