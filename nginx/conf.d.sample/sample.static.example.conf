# sample.static.example — keep in sync with DOMAINS in domains.env.
# Static-only site (no upstream): serves files bind-mounted into the nginx
# container at /usr/share/nginx/static/sample.static.example (host source in
# the nginx quadlet's Volume=).

server {
    listen 80;
    server_name sample.static.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sample.static.example;

    ssl_certificate     /etc/letsencrypt/live/sample.static.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sample.static.example/privkey.pem;

    # HSTS header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # <url-path> and the alias must both keep their trailing slash — that is the
    # form that is NOT vulnerable to nginx's alias path-traversal.
    location <url-path> {
        alias /usr/share/nginx/static/sample.static.example/;
        expires 7d;
        # This location sets its own add_header, so the server-level HSTS above
        # is NOT inherited here — repeat it alongside Cache-Control.
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ =404;
    }
}
